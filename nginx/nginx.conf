events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # Загальні проксі заголовки для правильної передачі IP та хоста
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Використовуємо внутрішній DNS-сервер Docker для динамічного вирішення імен upstream сервісів
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # ── FastAPI Backend API ──────────────────────────────────────────
        location /api {
            set $backend_up "backend:8000";
            proxy_pass http://$backend_up;
        }

        # ── React Frontend SPA ───────────────────────────────────────────
        location / {
            set $frontend_up "frontend:5173";
            proxy_pass http://$frontend_up;
            
            # Підтримка WebSockets для Hot Module Replacement (HMR), якщо буде запущено в dev режимі
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

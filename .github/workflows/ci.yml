name: TaskFlow Hub CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ── Етап 1: Статичний аналіз та Юніт-тестування ────────────────────────────
  lint-and-test:
    name: Lint & Test Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx fastapi uvicorn sqlalchemy psycopg2-binary

      - name: Lint Python with flake8
        run: |
          # Перевіряє наявність критичних синтаксичних помилок (збірка впаде, якщо є помилки)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Інші помилки розглядає як попередження (не ламає збірку)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run backend unit tests
        run: |
          cd backend
          pytest -v

  # ── Етап 2: Збірка Docker-образів (Перевірка Dockerfile) ──────────────────
  build-docker:
    name: Build & Verify Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: taskflow-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: taskflow-frontend:latest
